---
- name: Automatizar configuracion de Switches Cisco (VLANs, Troncales y Acceso)
  hosts: switches_cisco
  gather_facts: false

  vars_files:
    - "{{ playbook_dir }}/../variables/sucursal_01.yml"

  tasks:
    - name: Configurar base de datos de VLANs (10, 20, 99)
      cisco.ios.ios_vlans:
        config:
          - vlan_id: "{{ item.id }}"
            name: "{{ item.nombre }}"
            state: active
        state: merged
      loop: "{{ vlans }}"

    - name: Configurar interfaces troncales
      cisco.ios.ios_config:
        parents: "interface {{ item.interfaz }}"
        lines:
          - "description {{ item.descripcion }}"
          - "switchport trunk encapsulation dot1q"
          - "switchport mode trunk"
          - "switchport trunk native vlan {{ item.vlan_nativa }}"
          - "switchport trunk allowed vlan {{ item.vlans_permitidas }}"
          - "no shutdown"
      loop: "{{ switches_config[inventory_hostname].troncales | default([]) }}"
      when:
        - switches_config[inventory_hostname] is defined
        - switches_config[inventory_hostname].troncales is defined

    - name: Configurar interfaces de acceso para usuarios
      cisco.ios.ios_config:
        parents: "interface {{ item.interfaz }}"
        lines:
          - "description {{ item.descripcion }}"
          - "switchport mode access"
          - "switchport access vlan {{ item.vlan }}"
          - "spanning-tree portfast"
          - "no shutdown"
      loop: "{{ switches_config[inventory_hostname].puertos_acceso | default([]) }}"
      when:
        - switches_config[inventory_hostname] is defined
        - switches_config[inventory_hostname].puertos_acceso is defined

    - name: Guardar la configuracion en NVRAM
      cisco.ios.ios_config:
        save_when: modified
